<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tailwind 類別 — CaveDuck 白名單</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Serif+KR:wght@500&family=Playfair+Display:wght@500&family=Racing+Sans+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/i18n.js"></script>
<style>.card .codebox .code{max-height:3.4em;white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}</style>
<style>
.subnav{display:flex;flex-wrap:wrap;gap:5px}
.subnav{min-height:26px;align-items:center}
.subhint{font-size:12px;color:var(--text-3);white-space:nowrap}
.sub-btn{border:1px dashed var(--card-border);background:transparent;border-radius:6px;padding:2px 9px;font-size:12.5px;color:var(--text-2)}
.sub-btn:hover{color:var(--text);border-color:var(--c)}
.sub-btn .n{font-size:11px;color:var(--text-3);margin-left:3px}
.subcat.tw{margin-bottom:1.2rem}
.subcat.tw>h3{font-size:13.5px;font-weight:700;color:var(--text);display:flex;gap:.5rem;align-items:center;margin:.3rem 0 .55rem}
.subcat.tw>h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.subcat.tw>h3 .n{font-size:12px;font-weight:400;color:var(--text-3)}
.info{position:relative;flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--card-border);display:grid;place-items:center;font-size:11px;color:var(--text-3);cursor:help;font-style:normal}
.info:hover{color:var(--text);border-color:var(--card-hover)}
.info .tip{display:none;position:absolute;right:0;top:24px;z-index:5;width:260px;background:var(--bg-2);border:1px solid var(--card-border);border-radius:8px;padding:.45rem .6rem;font-family:ui-monospace,monospace;font-size:11px;color:var(--text-2);box-shadow:var(--shadow);word-break:break-all;text-align:left}
.info:hover .tip,.info:focus .tip{display:block}
.pv{display:flex;align-items:center;gap:.6rem;min-height:34px}
.pv .sw{width:44px;height:26px;border-radius:6px;border:1px solid var(--card-border)}
.pv .bx{width:54px;height:30px;background:var(--accent-6);border:1px solid var(--card-border)}
.pv .tx{font-size:15px;color:var(--text)}
.pv .im{width:54px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--accent-3),var(--accent-6))}
.card.tw .desc{font-size:13.5px}
.subnote{font-size:12.5px;color:var(--text-2);line-height:1.6;margin:-.2rem 0 .7rem;padding:.45rem .7rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:0 6px 6px 0}
.hvrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%}
.hvcol{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:6px;min-width:0}
.hvcol.lite{background:#eceef2}
.hvcol small{font-size:10px;color:var(--text-3);white-space:nowrap}
.hvcol.lite small{color:#555}
.hvarr{color:var(--text-3)}
.hvel{transition:all .25s}
.hvel.box,.hvel.lite{display:inline-block;white-space:nowrap;padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text);background-color:color-mix(in srgb,var(--text-3) 25%,transparent)}
.hvel.lite{background-color:#fff;color:#333}
.hvel.text{font-size:14px;font-weight:600;color:var(--text)}
.hvel.scroll{display:block;width:110px;height:44px;font-size:11px;border:1px solid var(--card-border);border-radius:5px;padding:2px 5px}
img.hvel{width:48px;height:48px;border-radius:6px}
.bpst{font-size:11px;color:var(--text-3);margin-bottom:4px;padding:2px 6px;border-radius:4px;border:1px dashed var(--card-border)}
.bpst.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.grpd{border:1px dashed var(--text-3);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--text-3);display:flex;flex-direction:column;gap:6px;cursor:default}
.grpd:hover{border-color:var(--st)}
.grpc{display:inline-block;align-self:flex-start;padding:4px 10px;border-radius:5px;background-color:color-mix(in srgb,var(--text-3) 25%,transparent);color:var(--text);font-size:12px;transition:all .25s}
.actd{display:inline-block;padding:8px 16px;border-radius:6px;background-color:color-mix(in srgb,var(--text-3) 25%,transparent);color:var(--text);font-size:12px;cursor:pointer;user-select:none}
.dm.dcap2{font-size:12px;line-height:1.55;margin:0;max-width:260px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html">← 回首頁</a>
  <h1><span class="ico">💠</span> Tailwind 類別</h1>
  <button class="theme-btn" id="themeToggle" aria-label="切換主題"></button>
</header>
<div class="tools">
  <div class="row">
    <label class="search">🔍 <input id="q" type="search" placeholder="搜尋 class 或說明，例如「圓角」「置中」「p-4」"></label>
    <span class="count" id="count"></span>
  </div>
  <div class="row"><span class="lbl">分類</span><div class="catnav" id="catnav"></div></div>
  <div class="row"><span class="lbl">細項</span><div class="subnav" id="subnav"><span class="subhint">先點上面的分類，這裡會出現細項</span></div></div>
</div>
<div class="note">
  <span><strong>怎麼用：</strong>把 class 名稱加在標籤上，例如 <code>&lt;div class="p-4 rounded-lg bg-primary"&gt;</code>，多個用空白隔開。這裡列出的 class 在<strong>聊天室和角色介面都能用</strong>（兩邊都實測過；兩邊載入的是同一批樣式表，平台也不過濾 class）。</span>
  <span>想看平台內建 class 的即時預覽，可以用 <a href="https://prysline.github.io/caveduck-class-reference/" target="_blank" rel="noopener" style="color:var(--info);text-decoration:underline">Prysline Class Reference ↗</a></span>
</div>
<main class="main" id="main"><div class="empty">載入中…</div></main>

      b.addEventListener('click', function () { var t = document.getElementById(b.dataset.target); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    });
  }
  nav.querySelectorAll('.cat-btn').forEach(function (b) { b.addEventListener('click', function () { showSubs(b.dataset.target.replace('cat-', '')); }); });
  var cur = null;
  new MutationObserver(function () {
    var on = nav.querySelector('.cat-btn.on'); var id = on ? on.dataset.target.replace('cat-', '') : null;
    if (id && id !== cur) { cur = id; showSubs(id); }
  }).observe(nav, { subtree: true, attributes: true, attributeFilter: ['class'] });

  CD.bindSearch(document.getElementById('q'));
  CD.apply();
  CD.initMotion();
  // 寬度條件：顯示目前畫面寬度有沒有達到
  function updBp() { var w = window.innerWidth; main.querySelectorAll('.bpst[data-bp]').forEach(function (el) { var bp = +el.dataset.bp, ok = bp > 0 ? w >= bp : w < -bp; el.className = 'bpst' + (ok ? ' on' : ''); el.textContent = _t('你現在的畫面寬 ') + w + 'px → ' + el.dataset.p + ': ' + (ok ? _t('有作用（預覽就是現在的樣子）') : _t('沒作用（預覽是寬度達到時的樣子）')); }); }
  updBp(); window.addEventListener('resize', updBp); window.CD_onSelect = function () { updBp(); };
  // group-hover、active 預覽
  main.addEventListener('mouseover', function (e) { var g = e.target.closest && e.target.closest('.grpd'); if (g) { var c = g.querySelector('.grpc'); c.setAttribute('style', c.dataset.hv); } });
  main.addEventListener('mouseout', function (e) { var g = e.target.closest && e.target.closest('.grpd'); if (g && !g.contains(e.relatedTarget)) g.querySelector('.grpc').setAttribute('style', ''); });
  ['mousedown', 'touchstart'].forEach(function (ev) { main.addEventListener(ev, function (e) { var a = e.target.closest && e.target.closest('.actd'); if (a) a.setAttribute('style', a.dataset.hv); }, { passive: true }); });
  ['mouseup', 'mouseleave', 'touchend'].forEach(function (ev) { main.addEventListener(ev, function () { main.querySelectorAll('.actd[style]').forEach(function (a) { a.removeAttribute('style'); }); }, true); });
  // hover 預覽：滑鼠移上左邊那格時套用 hover 的樣式
  main.addEventListener('mouseover', function (e) { var el = e.target.closest && e.target.closest('.hvlive'); if (el && !el.dataset.on) { el.dataset.on = 1; el.style.cssText = el.dataset.base + ';' + el.dataset.hv; } });
  main.addEventListener('mouseout', function (e) { var el = e.target.closest && e.target.closest('.hvlive'); if (el && !el.contains(e.relatedTarget)) { delete el.dataset.on; el.style.cssText = el.dataset.base; } });
});
function showAllTiles(btn) { var box = btn.parentNode; box.querySelectorAll('.more-hidden').forEach(function (t) { t.classList.remove('more-hidden'); }); btn.remove(); CD.focusKeys(box); }
</script>
</body>
</html>
