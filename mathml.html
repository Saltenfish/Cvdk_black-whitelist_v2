<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學公式 — CaveDuck 白名單</title>
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/i18n.js"></script>
<style>
.preview.fig{display:flex;align-items:center;justify-content:center;min-height:64px;font-size:20px}
.preview.fig math{font-size:22px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html">← 回首頁</a>
  <h1><span class="ico">∑</span> 數學公式 <span style="font-size:12px;font-weight:400;color:var(--text-3)">MathML</span></h1>
  <button class="theme-btn" id="themeToggle" aria-label="切換主題"></button>
</header>
<div class="tools">
  <div class="row">
    <label class="search">🔍 <input id="q" type="search" placeholder="搜尋標籤或說明，例如「分數」「上標」「根號」"></label>
    <span class="count" id="count"></span>
  </div>
  <div class="row"><span class="lbl">分類</span><div class="catnav" id="catnav"></div></div>
</div>
<div class="note">
  <span>MathML 用標籤把公式「一塊一塊」組起來：數字放 <code>&lt;mn&gt;</code>、代號放 <code>&lt;mi&gt;</code>、符號放 <code>&lt;mo&gt;</code>，外面再包 <code>&lt;math&gt;</code>。</span>
  <span><strong>只有聊天室能用</strong>，角色介面不會顯示。</span>
</div>
<main class="main" id="main"><div class="empty">載入中…</div></main>

<script src="data/mathml.js"></script>
<script src="assets/app.js"></script>
<script>
CD.initTheme();
CD.loadJSON('data/mathml.json').then(function (d) {
  var byG = {};
  d.items.forEach(function (it) { (byG[it.group] = byG[it.group] || []).push(it); });
  var html = '', sections = [];
  d.groups.forEach(function (g) {
    var items = byG[g.id] || []; if (!items.length) return;
    var isNone = g.id === 'none';
    var c = isNone ? 'var(--no)' : 'var(--accent-' + g.accent + ')';
    sections.push({ id: g.id, name: g.name, count: items.length, accent: isNone ? 0 : g.accent, color: isNone ? 'var(--no)' : null });
    html += '<section class="cat" id="cat-' + g.id + '" data-status="' + (isNone ? 'none' : '') + '" style="--c:' + c + '"><h2>' + CD.esc(g.name) + '<span class="n">' + items.length + '</span><span class="sub">' + CD.esc(g.hint || '') + '</span></h2>';
    if (isNone) {
      html += CD.chipList(items.map(function (i) { return { n: '<' + i.tag + '>', r: i.reason }; }), 'n', 'r');
    } else {
      html += '<div class="grid">';
      items.forEach(function (it) {
        html += '<div class="card bycat" data-status="allow" data-search="' + CD.esc(it.tag + ' ' + it.desc + ' ' + it.when) + '">'
          + '<div class="head"><div class="name">&lt;' + CD.esc(it.tag) + '&gt;</div></div>'
          + '<div class="desc">' + CD.esc(it.desc) + '</div>'
          + (it.preview ? '<div class="preview fig">' + it.preview + '</div>' : '')
          + CD.codeBlock(it.example, { tag: it.tag }) + '</div>';
      });
      html += '</div>';
    }
    html += '</section>';
  });
  html += _t('<div class="empty hidden" id="emptyMsg">沒有符合的項目</div>');
  document.getElementById('main').innerHTML = html;
  CD.buildCatNav(document.getElementById('catnav'), sections);
  CD.bindSearch(document.getElementById('q'));
  CD.apply();
});
</script>
</body>
</html>
